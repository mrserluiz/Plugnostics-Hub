name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile plugin
        run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Plugnostics-Hub-0.1.0
          path: target/Plugnostics-Hub-0.1.0.jar
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --title "Plugnostics-Hub 0.1.0 (Experimental)" --notes "Experimental MVP. Test on staging Paper server. GitHub reports are opt-in and redaction is best-effort." --prerelease
          gh release upload v0.1.0 target/Plugnostics-Hub-0.1.0.jar --clobber
