name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile plugin
        run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Plugnostics-Hub-0.2.1
          path: target/Plugnostics-Hub-0.2.1.jar
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1 >/dev/null 2>&1 || gh release create v0.2.1 --title "Plugnostics-Hub 0.2.1 (Experimental)" --notes "Local logging: per-plugin files, unified player activity, separate server errors. No uploads or credentials required. Experimental; test on staging Paper." --prerelease
          gh release upload v0.2.1 target/Plugnostics-Hub-0.2.1.jar --clobber

